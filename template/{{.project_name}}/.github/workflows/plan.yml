# lely plans the deploy of the dev target on every pull request and posts the plan as a
# comment, updated in place. Needs DATABRICKS_HOST (a variable) and DATABRICKS_TOKEN (a
# secret) on the repository, and WAREHOUSE_ID as a variable.
name: plan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # the plan's comment

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a new push makes the last plan stale

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      BUNDLE_VAR_warehouse_id: ${{ vars.WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - run: uv sync --locked
      - run: lely plan -t dev -o plan.json --github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: hashFiles('plan.json') != ''
        with:
          name: lely-plan-dev
          path: plan.json
