# The gate on every change: what `mise run check` runs, and the example pipeline into a
# local database. No workspace needed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - run: uv sync --locked
      - run: mise run check
      - run: mise run dev
